<!--
  ST. PAUL'S — GREETINGS FRIENDS 70/30 COMPONENT

  Required parent-email mobile CSS:
  @media only screen and (max-width:700px) {
    .greetings-copy,
    .greetings-mission { display:block !important; width:100% !important; max-width:100% !important; box-sizing:border-box !important; }
    .greetings-copy { padding:32px 24px 22px 24px !important; }
    .greetings-mission { padding:0 24px 32px 24px !important; text-align:center !important; }
    .greetings-mission img { width:100% !important; max-width:320px !important; height:auto !important; margin:0 auto !important; }
  }

  Replace only the bracketed greeting copy. Preserve approved wording.
  The v4 Greetings icon remains in use until the individual v5 transparent asset is supplied.
-->
<tr>
  <td align="center" class="section-pad" style="padding:20px 44px;">
    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="width:100%; background-color:#FDFBF7; border:1px solid #E5E7EB; border-radius:24px;">
      <tr>
        <!-- 70%: approved pastoral greeting -->
        <td width="70%" valign="top" class="greetings-copy" style="width:70%; padding:46px 36px 46px 46px;">
          <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
            <tr>
              <td width="84" valign="middle" style="width:84px; padding-right:16px;">
                <img
                  src="https://custodybuddy.github.io/st-pauls-newsletter-assets/assets/icons/02-pastoral-note-heart-dialogue.png"
                  alt="Gold heart inside a speech bubble"
                  width="72"
                  style="display:block; width:72px; max-width:72px; height:auto; border:0; outline:none; text-decoration:none;"
                />
              </td>
              <td valign="middle">
                <p style="margin:0 0 8px 0; color:#B8860B; font-family:Inter,Arial,sans-serif; font-size:16px; line-height:1.4; font-weight:800; letter-spacing:0.10em; text-transform:uppercase;">Pastoral Note</p>
                <h2 style="margin:0; color:#1E293B; font-family:Lora,Georgia,serif; font-size:38px; line-height:1.15; font-weight:700;">Greetings Friends</h2>
              </td>
            </tr>
          </table>

          <div style="height:3px; width:72px; margin:24px 0; background-color:#D4AF37; line-height:3px; font-size:3px;">&nbsp;</div>

          <div style="color:#475569; font-family:Inter,Arial,sans-serif; font-size:19px; line-height:1.75;">
            <p style="margin:0;">[PASTE APPROVED GREETINGS FRIENDS COPY HERE]</p>
          </div>
        </td>

        <!-- 30%: permanent Our Mission graphic -->
        <td width="30%" valign="middle" align="center" class="greetings-mission" style="width:30%; padding:30px 30px 30px 0; text-align:center;">
          <img
            src="https://custodybuddy.github.io/st-pauls-newsletter-assets/assets/illustrations/st-pauls-our-mission-card-v2-email.jpg"
            alt="Our Mission: We are a Christ-centered, worshipping community serving and leading people to Jesus."
            width="300"
            style="display:block; width:100%; max-width:300px; height:auto; margin:0 auto; border:0; border-radius:20px; outline:none; text-decoration:none;"
          />
        </td>
      </tr>
    </table>
  </td>
</tr>
